###############################################################################
# config/drl.yaml
# All configuration for the Deep Reinforcement Learning energy trading agent.
###############################################################################

environment:
  # ── Portfolio ──────────────────────────────────────────────────────────────
  initial_cash: 100_000.0          # Starting portfolio cash (USD)
  # Defaults match the daily EIA Henry Hub runs (train_on_eia.py / the Chapter 5
  # agents), so the Airflow DAG trains the evaluated configuration (DEF-13 fix).
  # The original hourly synthetic values were: max_position 100, stop-loss 0.30,
  # episode 720, 500k steps, hourly annualisation (see run_real_training.py).
  max_position_mwh: 25_000         # Max position (MMBtu for gas; key name kept for code compatibility)
  transaction_cost_pct: 0.001      # 0.1% cost per trade (slippage + fees)
  min_trade_mwh: 1.0               # Minimum trade size (avoids spam)
  stop_loss_pct: 0.50              # Episode ends if portfolio drops 50%

  # ── Reward shaping ────────────────────────────────────────────────────────
  reward_scaling: 1e-4             # Scale rewards to ~[-1, 1] range for stability
  holding_penalty: 0.0             # Optional small penalty for idle positions
  use_sharpe_reward: false         # Use rolling Sharpe ratio as reward instead of PnL

  # ── State ─────────────────────────────────────────────────────────────────
  lookback_window: 1               # How many past timesteps to stack in state
  include_portfolio_state: true    # Append [cash_ratio, position_ratio, unrealised_pnl] to obs
  normalise_obs: true              # Z-score normalise the feature obs

  # ── Episodes ──────────────────────────────────────────────────────────────
  episode_length: 252              # Timesteps per episode (252 trading days = 1 year)
  random_start: true               # Randomly sample episode start each reset

# ── Action space ─────────────────────────────────────────────────────────────
action:
  type: continuous                 # continuous | discrete
  # continuous: Box([-1, 1]) → maps to target position fraction of max_position_mwh
  # discrete:   Discrete(3)  → 0=Hold, 1=Buy, 2=Sell (fixed trade_size_mwh)
  discrete_trade_size_mwh: 10.0   # Used only when type=discrete

# ── Algorithm ────────────────────────────────────────────────────────────────
training:
  algorithm: PPO                   # PPO | SAC | TD3 | A2C
  total_timesteps: 300_000         # the PPO-300k configuration evaluated in Chapter 5
  n_envs: 4                        # Parallel environments for PPO/A2C
  eval_freq: 10_000                # Evaluate every N steps
  n_eval_episodes: 5
  save_freq: 50_000
  log_interval: 1
  seed: 42
  device: cpu                      # cpu | cuda | auto

  # Checkpoints
  checkpoint_dir: "./checkpoints/drl"
  best_model_path: "./checkpoints/drl/best_model"

# ── PPO Hyperparameters ───────────────────────────────────────────────────────
PPO:
  learning_rate: 3.0e-4
  n_steps: 2048                    # Steps per rollout per env
  batch_size: 64
  n_epochs: 10
  gamma: 0.99                      # Discount factor
  gae_lambda: 0.95                 # GAE lambda for advantage estimation
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01                   # Entropy bonus (encourages exploration)
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy: MlpPolicy
  net_arch: [256, 256, 128]        # Shared + policy/value heads

# ── SAC Hyperparameters (for continuous actions) ──────────────────────────────
SAC:
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  learning_starts: 10_000
  batch_size: 256
  tau: 0.005                       # Soft update coefficient
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto                   # Automatic entropy tuning
  target_entropy: auto
  policy: MlpPolicy
  net_arch: [256, 256, 128]

# ── MLflow ────────────────────────────────────────────────────────────────────
mlflow:
  experiment_name: "energy-drl-trading"
  tracking_uri: "http://mlflow-server:5000"
  tags:
    project: energy-trading-mlops
    model_type: drl

# ── Backtesting ───────────────────────────────────────────────────────────────
backtest:
  benchmark: buy_and_hold          # buy_and_hold | random_agent | none
  risk_free_rate: 0.05             # Annual risk-free rate for Sharpe calc
  output_dir: "./reports/backtest"
  periods_per_year: 252            # daily data: 252 trading days per year
  steps_per_day: 1
  units:
    step: trading days
    price: $/MMBtu
    position: MMBtu

# ── Closed loop: quality gate, registry, paper trading, monitoring, retraining ──
# Thresholds were fixed on 2026-11-23, before the gate was run on any model.
quality_gate:
  # Judged on the validation split only (never the test split), with the
  # training-split normaliser so validation rows never see their own statistics.
  n_random_agents: 30              # seeded Random Agents (seeds 0..29), as in Chapter 5
  min_random_beaten_pct: 80.0      # (b) must beat at least 80 % of them (24 of 30)
  max_drawdown_floor_pct: -40.0    # (c) worst peak-to-trough fall on validation; stop-loss is -50 %
  # (a) is fixed: validation return must be strictly higher than Buy & Hold's

registry:
  tracking_uri: "./mlruns"         # same store as the Chapter 5 runs (committed to git)
  model_name: energy_trading_ppo
  champion_alias: champion         # MLflow alias, not the deprecated stages

paper_trading:                     # paper trading (simulated): no real money
  start_date: "2026-07-07"         # first day after the July training data ended
  output_dir: "./reports/live"

monitoring:
  min_days: 20                     # no alarm before 20 trading days of paper trading
  max_gap_since_deploy_pp: -10.0   # champion return minus Buy & Hold since promotion
  rolling_window_days: 60
  max_rolling_gap_pp: -10.0        # same gap over the last 60 trading days
  max_drawdown_from_peak_pct: -30.0
  watch_fraction: 0.5              # "watch" when a metric is past half of its threshold
  retrain_cooldown_days: 20        # trading days to wait after a retrain that failed the gate

retraining:
  seeds: [42, 1, 2]
  total_timesteps: 300_000
  validation_days: 252             # walk-forward: the most recent 252 trading days are validation
  use_final_model: true            # challenger = final model, so the validation window stays unseen
